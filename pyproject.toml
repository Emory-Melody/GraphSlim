[project]
name = "graphslim"
version = "1.3.4"
description = "Slimming the graph data for graph learning"
authors = [
    {name = "Rockcor", email = "jshmhsb@gmail.com"},
]
license = "MIT"
requires-python = ">=3.10, <3.12"
dependencies = [
    "click",
    "deeprobust",
    "gdown",
    "networkit",
    "networkx",
    "numpy",
    "ogb",
    "pillow>=12.3.0",
    "PyGSP",
    "scikit_learn",
    "scipy",
    "sortedcontainers",
    "torch",
    "torch_geometric",
    "tqdm",
]
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dgl = ["dgl==1.1.3", "numpy<2"]
tracking = ["wandb"]
viz = ["matplotlib", "networkx"]
test = ["pytest", "matplotlib"]
dev = ["build", "pytest", "ruff", "twine", "wandb", "matplotlib"]
fuzzy = ["scikit-fuzzy"]
docs = ["sphinx", "myst-parser", "sphinx-rtd-theme"]

[project.scripts]
graphslim-train = "graphslim.train_all:entrypoint"
graphslim-eval = "graphslim.run_eval:entrypoint"
graphslim-doctor = "graphslim.doctor:main"
graphslim-visualize = "graphslim.visualization:main"

[tool.setuptools.packages.find]
include = ["graphslim*"]
exclude = ["benchmark*", "checkpoints*", "docs*", "examples*", "figures*", "geom_buffer*", "interface*"]
namespaces = false

[tool.setuptools.package-data]
graphslim = ["THIRD_PARTY_NOTICES.md", "licenses/*.txt", "configs/**/*.json"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# This offline evidence artifact is immutable and has a checked SHA-256 manifest.
exclude = ["benchmark/results/reproducibility_20261103/verify.py", "benchmark/results/reproducibility_20261105/verify.py", "benchmark/results/reproducibility_20261106/base_20261105/verify.py"]
