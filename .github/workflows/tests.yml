name: Checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {python: '3.10', torch: '2.6.0', torchvision: '0.21.0'}
          - {python: '3.11', torch: '2.6.0', torchvision: '0.21.0'}
          - {python: '3.10', torch: '2.8.0', torchvision: '0.23.0'}
          - {python: '3.11', torch: '2.8.0', torchvision: '0.23.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }} --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --system torch-scatter torch-sparse --no-deps --no-index -f https://data.pyg.org/whl/torch-${{ matrix.torch }}+cpu.html
      - run: uv pip install --system -e '.[dev,docs,fuzzy]' 'dgl==1.1.3' 'numpy==1.26.4' --constraint <(printf 'torch==${{ matrix.torch }}\ntorchvision==${{ matrix.torchvision }}\n')
        shell: bash
      - run: python -m graphslim.doctor --device cpu --dgl --json --output doctor.json
      - run: python -m pytest -q
      - run: ruff check graphslim examples benchmark tests interface
      - run: ruff format --check graphslim examples benchmark tests interface
      - run: python -m benchmark.render_results --check
      - run: sphinx-build -E -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-py${{ matrix.python }}-torch${{ matrix.torch }}-cpu
          path: doctor.json
